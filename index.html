<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minimal Countdown</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 0到達時の発光エフェクト */
    body.flash {
      animation: screenFlash 1.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes screenFlash {
      0% { background-color: #ffffff; }
      20% { background-color: #064e3b; }
      100% { background-color: #022c22; }
    }

    /* 右上：ミニマル設定アイコン */
    .btn-settings {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: all 0.2s;
    }

    .btn-settings:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: rotate(30deg);
    }

    .btn-settings svg {
      width: 20px;
      height: 20px;
      stroke: #94a3b8;
    }

    /* メイン操作エリア */
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      cursor: grab;
      position: relative;
      z-index: 2;
    }

    .container:active {
      cursor: grabbing;
    }

    /* 上下スワイプを直感的に伝えるインジケーター（<>を上下にした山型デザイン） */
    .swipe-hint {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      opacity: 0.35;
      transition: opacity 0.3s, transform 0.2s;
    }

    .swipe-hint.top {
      top: 18%;
      animation: floatUp 2s ease-in-out infinite;
    }

    .swipe-hint.bottom {
      bottom: 18%;
      animation: floatDown 2s ease-in-out infinite;
    }

    @keyframes floatUp {
      0%, 100% { transform: translateY(0); opacity: 0.25; }
      50% { transform: translateY(-8px); opacity: 0.6; }
    }

    @keyframes floatDown {
      0%, 100% { transform: translateY(0); opacity: 0.25; }
      50% { transform: translateY(8px); opacity: 0.6; }
    }

    .swipe-hint svg {
      width: 32px;
      height: 32px;
      stroke: #94a3b8;
    }

    /* カウント数字表示 */
    .display-box {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
    }

    .display {
      font-size: 8rem;
      font-weight: 900;
      letter-spacing: -2px;
      text-align: center;
      padding: 0 20px;
      word-break: break-word;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s;
    }

    /* リセット（ダブルクリック）時のバウンド効果 */
    .pop-reset {
      animation: resetPop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes resetPop {
      0% { transform: scale(0.7); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 到達時文字スタイル */
    .go {
      color: #ecfdf5;
      text-shadow: 
        0 0 10px #4ade80,
        0 0 30px #22c55e,
        0 0 70px #16a34a,
        0 0 120px #15803d;
      animation: goPulse 0.8s ease-in-out infinite alternate;
    }

    @keyframes goPulse {
      from { transform: scale(1.15); }
      to { transform: scale(1.3); }
    }

    /* 一時停止ビジュアルアイコン */
    .pause-indicator {
      position: absolute;
      top: -30px;
      display: flex;
      gap: 6px;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }

    .pause-indicator span {
      width: 6px;
      height: 24px;
      background: #f59e0b;
      border-radius: 4px;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.6);
    }

    body.paused .pause-indicator {
      opacity: 1;
      transform: scale(1);
    }

    body.paused .display {
      opacity: 0.6;
    }

    /* 文字編集モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 20px;
      width: 85%;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
    }

    .modal-card input {
      width: 100%;
      padding: 12px 14px;
      background: #090d16;
      border: 1px solid #334155;
      border-radius: 10px;
      color: #fff;
      font-size: 1.15rem;
      margin-bottom: 20px;
      outline: none;
      user-select: auto;
      -webkit-user-select: auto;
      touch-action: auto;
      text-align: center;
    }

    .modal-card input:focus {
      border-color: #22c55e;
    }

    .modal-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-cancel {
      background: #334155;
      color: #94a3b8;
    }

    .btn-save {
      background: #22c55e;
      color: #090d16;
    }
  </style>
</head>
<body>

  <!-- 設定アイコン（文字なし） -->
  <button class="btn-settings" id="openModalBtn" aria-label="Settings">
    <svg fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  </button>

  <!-- タッチ・スワイプエリア -->
  <div class="container" id="touchArea">
    <!-- 上シェブロン (︿) -->
    <div class="swipe-hint top">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="18 15 12 9 6 15"></polyline>
      </svg>
    </div>

    <!-- カウント数値表示 & 一時停止マーク -->
    <div class="display-box">
      <div class="pause-indicator" id="pauseIndicator">
        <span></span>
        <span></span>
      </div>
      <div class="display" id="display">3</div>
    </div>

    <!-- 下シェブロン (﹀) -->
    <div class="swipe-hint bottom">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </div>
  </div>

  <!-- モーダル（テキスト変更用） -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <input type="text" id="customTextInput" maxlength="15">
      <div class="modal-actions">
        <button class="btn btn-cancel" id="closeModalBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
        <button class="btn btn-save" id="saveTextBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const body = document.body;
    const display = document.getElementById('display');
    const touchArea = document.getElementById('touchArea');

    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveTextBtn = document.getElementById('saveTextBtn');
    const customTextInput = document.getElementById('customTextInput');

    let finishText = localStorage.getItem('finishText') || 'GO!';
    let count = 3;
    let timerId = null;
    let isTouching = false;
    let isPaused = false;
    let startY = 0;
    let accumulatedDeltaY = 0;
    const SWIPE_THRESHOLD = 32;

    // ダブルタップ検知用
    let lastTapTime = 0;

    function updateDisplay(triggerAnim = false) {
      if (count === 0) {
        display.textContent = finishText;
        display.classList.add('go');
        body.classList.add('flash');

        if (finishText.length > 5) {
          display.style.fontSize = '4.5rem';
        } else if (finishText.length > 3) {
          display.style.fontSize = '6rem';
        } else {
          display.style.fontSize = '8rem';
        }
      } else {
        display.textContent = count;
        display.classList.remove('go');
        body.classList.remove('flash');
        display.style.fontSize = '8rem';
      }

      if (triggerAnim) {
        display.classList.remove('pop-reset');
        void display.offsetWidth; // リフロー発生
        display.classList.add('pop-reset');
      }
    }

    function startCountdown() {
      if (isPaused) return;
      stopCountdown();

      if (count <= 0) {
        updateDisplay();
        return;
      }

      timerId = setInterval(() => {
        count--;
        updateDisplay();

        if (count <= 0) {
          clearInterval(timerId);
          timerId = null;
        }
      }, 1000);
    }

    function stopCountdown() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // 一時停止の切り替え
    function togglePause() {
      if (count <= 0) return;

      isPaused = !isPaused;
      if (isPaused) {
        stopCountdown();
        body.classList.add('paused');
      } else {
        body.classList.remove('paused');
        startCountdown();
      }
    }

    // 3秒に自動リセット
    function resetToThree() {
      stopCountdown();
      isPaused = false;
      body.classList.remove('paused');
      count = 3;
      updateDisplay(true);
      startCountdown();
    }

    // === タッチイベント処理 ===
    touchArea.addEventListener('touchstart', (e) => {
      if (modalOverlay.classList.contains('active')) return;

      // 2本指タップ判定：即座に一時停止
      if (e.touches.length >= 2) {
        isTouching = false;
        togglePause();
        return;
      }

      // 1本指の場合
      if (e.touches.length === 1) {
        // ダブルタップ検知（300ms以内）
        const currentTime = new Date().getTime();
        const tapInterval = currentTime - lastTapTime;
        if (tapInterval < 300 && tapInterval > 0) {
          resetToThree();
          lastTapTime = 0;
          return;
        }
        lastTapTime = currentTime;

        isTouching = true;
        isPaused = false;
        body.classList.remove('paused');
        startY = e.touches[0].clientY;
        accumulatedDeltaY = 0;
        stopCountdown();
      }
    }, { passive: false });

    touchArea.addEventListener('touchmove', (e) => {
      if (!isTouching || e.touches.length !== 1) return;
      e.preventDefault();

      const clientY = e.touches[0].clientY;
      const diffY = clientY - startY;
      accumulatedDeltaY += diffY;
      startY = clientY;

      while (Math.abs(accumulatedDeltaY) >= SWIPE_THRESHOLD) {
        if (accumulatedDeltaY < 0) {
          count++;
          accumulatedDeltaY += SWIPE_THRESHOLD;
        } else {
          if (count > 0) count--;
          accumulatedDeltaY -= SWIPE_THRESHOLD;
        }
        updateDisplay();
      }
    }, { passive: false });

    touchArea.addEventListener('touchend', (e) => {
      if (e.touches.length === 0 && isTouching) {
        isTouching = false;
        startCountdown();
      }
    });

    // === マウス & PC操作 ===
    // ダブルクリックで3秒リセット
    touchArea.addEventListener('dblclick', (e) => {
      if (e.target.closest('#openModalBtn')) return;
      resetToThree();
    });

    touchArea.addEventListener('mousedown', (e) => {
      if (modalOverlay.classList.contains('active')) return;
      if (e.target.closest('#openModalBtn')) return;

      isTouching = true;
      isPaused = false;
      body.classList.remove('paused');
      startY = e.clientY;
      accumulatedDeltaY = 0;
      stopCountdown();
    });

    window.addEventListener('mousemove', (e) => {
      if (!isTouching) return;

      const diffY = e.clientY - startY;
      accumulatedDeltaY += diffY;
      startY = e.clientY;

      while (Math.abs(accumulatedDeltaY) >= SWIPE_THRESHOLD) {
        if (accumulatedDeltaY < 0) {
          count++;
          accumulatedDeltaY += SWIPE_THRESHOLD;
        } else {
          if (count > 0) count--;
          accumulatedDeltaY -= SWIPE_THRESHOLD;
        }
        updateDisplay();
      }
    });

    window.addEventListener('mouseup', () => {
      if (isTouching) {
        isTouching = false;
        startCountdown();
      }
    });

    // スペースキーで一時停止トグル
    window.addEventListener('keydown', (e) => {
      if (modalOverlay.classList.contains('active')) return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePause();
      }
    });

    // === モーダル操作 ===
    openModalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopCountdown();
      customTextInput.value = finishText;
      modalOverlay.classList.add('active');
      customTextInput.focus();
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    saveTextBtn.addEventListener('click', () => {
      const val = customTextInput.value.trim();
      if (val) {
        finishText = val;
        localStorage.setItem('finishText', finishText);
      }
      modalOverlay.classList.remove('active');
      updateDisplay();
    });

    // 初期化
    updateDisplay();
  </script>
</body>
</html>
