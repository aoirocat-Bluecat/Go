<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>スワイプカウントダウン</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: background-color 0.4s ease;
    }

    /* ゼロ到達時の画面全体のフラッシュ */
    body.flash {
      animation: screenFlash 1.6s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    @keyframes screenFlash {
      0% {
        background-color: #ffffff;
      }
      20% {
        background-color: #064e3b;
      }
      100% {
        background-color: #022c22;
      }
    }

    /* 設定ボタンと入力フォーム */
    .top-bar {
      position: absolute;
      top: 24px;
      width: 100%;
      padding: 0 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .indicator {
      font-size: 0.85rem;
      color: #64748b;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: color 0.3s;
    }

    body.flash .indicator {
      color: #86efac;
    }

    .edit-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #e2e8f0;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .edit-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      cursor: grab;
      z-index: 2;
    }

    .container:active {
      cursor: grabbing;
    }

    .display {
      font-size: 7.5rem;
      font-weight: 900;
      letter-spacing: -2px;
      text-align: center;
      padding: 0 20px;
      word-break: break-word;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.2s ease;
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ゼロ到達時の文字スタイル */
    .go {
      color: #ecfdf5;
      text-shadow: 
        0 0 10px #4ade80,
        0 0 30px #22c55e,
        0 0 60px #16a34a,
        0 0 100px #15803d;
      animation: goPop 0.8s ease-in-out infinite alternate;
    }

    @keyframes goPop {
      from { transform: scale(1.15); }
      to { transform: scale(1.3); }
    }

    .hint {
      position: absolute;
      bottom: 30px;
      font-size: 0.85rem;
      color: #94a3b8;
      text-align: center;
      line-height: 1.6;
      pointer-events: none;
      z-index: 2;
      transition: color 0.3s;
    }

    body.flash .hint {
      color: #6ee7b7;
    }

    /* 文字設定ダイアログモーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #1e293b;
      padding: 24px;
      border-radius: 16px;
      width: 85%;
      max-width: 320px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .modal-card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #f8fafc;
    }

    .modal-card input {
      width: 100%;
      padding: 10px 12px;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #fff;
      font-size: 1.1rem;
      margin-bottom: 16px;
      outline: none;
      user-select: auto;
      -webkit-user-select: auto;
      touch-action: auto;
    }

    .modal-card input:focus {
      border-color: #22c55e;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
    }

    .btn-cancel {
      background: #334155;
      color: #94a3b8;
    }

    .btn-save {
      background: #22c55e;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <!-- 上部バー -->
  <div class="top-bar">
    <div class="indicator" id="statusText">スワイプして時間を設定</div>
    <button class="edit-btn" id="openModalBtn">⚙ 文字を変更</button>
  </div>

  <!-- スワイプ操作エリア -->
  <div class="container" id="touchArea">
    <div class="display" id="display">3</div>
  </div>

  <div class="hint">
    👆 上にスワイプ：増やす<br>
    👇 下にスワイプ：減らす<br>
    ※指を離すとカウントダウン開始
  </div>

  <!-- 終了時テキスト変更用モーダル -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h3>到達時の文字を設定</h3>
      <input type="text" id="customTextInput" maxlength="15" placeholder="例: GO!, スタート!, 発射!">
      <div class="modal-actions">
        <button class="btn btn-cancel" id="closeModalBtn">キャンセル</button>
        <button class="btn btn-save" id="saveTextBtn">保存</button>
      </div>
    </div>
  </div>

  <script>
    const body = document.body;
    const display = document.getElementById('display');
    const touchArea = document.getElementById('touchArea');
    const statusText = document.getElementById('statusText');

    // モーダル関連要素
    const modalOverlay = document.getElementById('modalOverlay');
    const openModalBtn = document.getElementById('openModalBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const saveTextBtn = document.getElementById('saveTextBtn');
    const customTextInput = document.getElementById('customTextInput');

    // 保存されているテキスト、なければデフォルト「GO!」
    let finishText = localStorage.getItem('finishText') || 'GO!';

    let count = 3;
    let timerId = null;
    let isTouching = false;
    let startY = 0;
    let accumulatedDeltaY = 0;
    const SWIPE_THRESHOLD = 35; // 感度

    // 表示更新
    function updateDisplay() {
      if (count === 0) {
        display.textContent = finishText;
        display.classList.add('go');
        body.classList.add('flash');
        statusText.textContent = finishText;

        // 文字数が多い場合にフォントサイズを動的に調整
        if (finishText.length > 5) {
          display.style.fontSize = '4.5rem';
        } else if (finishText.length > 3) {
          display.style.fontSize = '6rem';
        } else {
          display.style.fontSize = '7.5rem';
        }
      } else {
        display.textContent = count;
        display.classList.remove('go');
        body.classList.remove('flash');
        display.style.fontSize = '7.5rem';
      }
    }

    // カウントダウン開始
    function startCountdown() {
      stopCountdown();

      if (count <= 0) {
        updateDisplay();
        return;
      }

      statusText.textContent = 'カウントダウン中...';

      timerId = setInterval(() => {
        count--;
        updateDisplay();

        if (count <= 0) {
          clearInterval(timerId);
          timerId = null;
        }
      }, 1000);
    }

    // カウントダウン停止
    function stopCountdown() {
      if (timerId !== null) {
        clearInterval(timerId);
        timerId = null;
      }
    }

    // タッチ / マウスダウン開始
    function handleStart(clientY) {
      // モーダル表示中はスワイプ無効
      if (modalOverlay.classList.contains('active')) return;

      isTouching = true;
      startY = clientY;
      accumulatedDeltaY = 0;

      stopCountdown();
      statusText.textContent = '設定中...';
    }

    // 移動（スワイプ / ドラッグ）
    function handleMove(clientY) {
      if (!isTouching) return;

      const diffY = clientY - startY;
      accumulatedDeltaY += diffY;
      startY = clientY;

      while (Math.abs(accumulatedDeltaY) >= SWIPE_THRESHOLD) {
        if (accumulatedDeltaY < 0) {
          count++;
          accumulatedDeltaY += SWIPE_THRESHOLD;
        } else {
          if (count > 0) {
            count--;
          }
          accumulatedDeltaY -= SWIPE_THRESHOLD;
        }
        updateDisplay();
      }
    }

    // タッチ終了（指を離した時）
    function handleEnd() {
      if (!isTouching) return;
      isTouching = false;
      startCountdown();
    }

    // === タッチイベント ===
    touchArea.addEventListener('touchstart', (e) => {
      handleStart(e.touches[0].clientY);
    }, { passive: false });

    touchArea.addEventListener('touchmove', (e) => {
      e.preventDefault();
      handleMove(e.touches[0].clientY);
    }, { passive: false });

    touchArea.addEventListener('touchend', handleEnd);
    touchArea.addEventListener('touchcancel', handleEnd);

    // === マウスイベント ===
    touchArea.addEventListener('mousedown', (e) => {
      handleStart(e.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      handleMove(e.clientY);
    });

    window.addEventListener('mouseup', handleEnd);

    // === 設定モーダルの開閉・保存処理 ===
    openModalBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      stopCountdown();
      customTextInput.value = finishText;
      modalOverlay.classList.add('active');
      customTextInput.focus();
    });

    closeModalBtn.addEventListener('click', () => {
      modalOverlay.classList.remove('active');
    });

    saveTextBtn.addEventListener('click', () => {
      const val = customTextInput.value.trim();
      if (val) {
        finishText = val;
        localStorage.setItem('finishText', finishText);
      }
      modalOverlay.classList.remove('active');
      updateDisplay();
    });

    // 初期表示
    updateDisplay();
  </script>
</body>
</html>
